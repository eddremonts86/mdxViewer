name: CI

on:
    push:
        branches: [master]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        # Runs on Linux on purpose: it catches the case-sensitive import errors
        # that a macOS filesystem silently tolerates.
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check formatting
              run: pnpm run format:check

            - name: Lint
              run: pnpm run lint

            - name: Typecheck and build
              run: pnpm run build

            # The whole suite runs in process against a temporary content
            # folder, so CI needs nothing listening on a port.
            - name: Tests
              run: pnpm run test:unit
