name: CI

on:
    push:
        branches: [master]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        # Runs on Linux on purpose: it catches the case-sensitive import errors
        # that a macOS filesystem silently tolerates.
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # One command, the same one AGENTS.md tells a contributor to run,
            # so the instruction and the gate can never disagree.
            - name: Verify
              run: pnpm run verify
